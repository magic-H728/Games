<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .home-title {
            font-size: 36px;
            font-weight: 900;
            color: white;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .home-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 40px;
        }
        .home-emoji {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
        }
        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 300px;
        }
        .home-btn {
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            display: block;
        }
        .home-btn:active {
            transform: scale(0.96);
        }
        .home-btn-player {
            background: rgba(255,255,255,0.95);
            color: #667eea;
        }
        .home-btn-staff {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-emoji">🐱🐭</div>
        <h1 class="home-title">躲猫猫大挑战</h1>
        <p class="home-subtitle">新生破冰活动 · 等你来战</p>
        <div class="home-buttons">
            <a href="/player/login" class="home-btn home-btn-player">🎮 玩家入口</a>
            <a href="/staff/login" class="home-btn home-btn-staff">🔧 工作人员入口</a>
        </div>
    </div>
</body>
</html>
