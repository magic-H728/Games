<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家管理 - 躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>👥 玩家管理</h1>
        </div>

        <div class="card">
            <div class="form-group" style="margin-bottom: 8px;">
                <input type="text" id="search" placeholder="搜索姓名/学号/微信号" oninput="filterPlayers()">
            </div>
            <div class="tab-group">
                <button class="tab-item active" onclick="filterRole(null, this)">全部</button>
                <button class="tab-item" onclick="filterRole('CAT', this)">🐱 猫</button>
                <button class="tab-item" onclick="filterRole('MOUSE', this)">🐭 鼠</button>
                <button class="tab-item" onclick="filterRole(null, this, 'DEAD')">💀 已阵亡</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">加载中</div>
        </div>

        <div class="card">
            <a href="/staff" class="btn btn-sm" style="background: #f0f0f0; color: #666; display: block; text-align: center; text-decoration: none;">← 返回控制台</a>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        if (!getToken() || getRole() !== 'STAFF') {
            window.location.href = '/staff/login';
        }

        let allPlayers = [];
        let currentRoleFilter = null;
        let currentStatusFilter = null;

        async function loadPlayers() {
            try {
                const data = await apiGet('/api/staff/players');
                if (!data) return;
                allPlayers = data;
                renderPlayers();
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="card"><p style="color: red;">${err.message}</p></div>`;
            }
        }

        function filterPlayers() {
            renderPlayers();
        }

        function filterRole(role, btn, status) {
            currentRoleFilter = role;
            currentStatusFilter = status || null;
            document.querySelectorAll('.tab-group .tab-item').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderPlayers();
        }

        function renderPlayers() {
            const search = document.getElementById('search').value.trim().toLowerCase();
            let filtered = allPlayers;

            if (currentRoleFilter) {
                filtered = filtered.filter(p => p.role === currentRoleFilter);
            }
            if (currentStatusFilter) {
                filtered = filtered.filter(p => p.status === currentStatusFilter);
            }
            if (search) {
                filtered = filtered.filter(p =>
                    (p.name || '').toLowerCase().includes(search) ||
                    (p.student_id || '').toLowerCase().includes(search) ||
                    (p.wechat_id || '').toLowerCase().includes(search)
                );
            }

            if (filtered.length === 0) {
                document.getElementById('content').innerHTML =
                    `<div class="card"><div style="text-align: center; padding: 20px; color: #888;">没有找到玩家</div></div>`;
                return;
            }

            let html = '<div class="card"><div class="table-wrapper"><table>';
            html += '<tr><th>姓名</th><th>学号</th><th>角色</th><th>状态</th><th>队伍</th><th>积分</th><th>操作</th></tr>';

            filtered.forEach(p => {
                html += `<tr>
                    <td>${p.name}</td>
                    <td style="font-size: 12px;">${p.student_id}</td>
                    <td>${getRoleBadge(p.role)}</td>
                    <td>${getStatusBadge(p.status)}</td>
                    <td style="font-size: 12px;">${p.team_name || '-'}</td>
                    <td style="font-weight: 600; color: #667eea;">${p.total_score}</td>
                    <td><button class="btn btn-sm" style="padding: 4px 8px; font-size: 12px; background: #f0f0f0; color: #666;" onclick="viewPlayer(${p.id})">详情</button></td>
                </tr>`;
            });

            html += '</table></div></div>';
            html += `<div class="card"><p style="font-size: 13px; color: #888; text-align: center;">共 ${filtered.length} 人</p></div>`;

            document.getElementById('content').innerHTML = html;
        }

        async function viewPlayer(gamePlayerId) {
            try {
                const data = await apiGet(`/api/staff/players/${gamePlayerId}`);
                if (!data) return;
                showPlayerModal(data);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function showPlayerModal(data) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal" style="max-width: 500px;">
                    <div class="modal-title">${data.name} ${getRoleBadge(data.role)}</div>
                    <div class="list-item"><span style="color:#888;">学号</span><span>${data.student_id}</span></div>
                    <div class="list-item"><span style="color:#888;">微信号</span><span>${data.wechat_id || '未填写'}</span></div>
                    <div class="list-item"><span style="color:#888;">状态</span><span>${getStatusBadge(data.status)}</span></div>
                    <div class="list-item"><span style="color:#888;">队伍</span><span>${data.team_name || '未分配'}</span></div>
                    <div class="list-item"><span style="color:#888;">生存轮次</span><span>${data.survival_round}</span></div>
                    <div class="list-item"><span style="color:#888;">累计生存</span><span>${formatTime(data.total_survival_seconds)}</span></div>
                    <div class="list-item"><span style="color:#888;">复活次数</span><span>${data.revive_count}</span></div>

                    <div style="margin-top: 16px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">积分明细</div>
                        <div class="list-item"><span style="color:#888;">抓捕积分</span><span>${data.score_breakdown.CAPTURE}</span></div>
                        <div class="list-item"><span style="color:#888;">小游戏积分</span><span>${data.score_breakdown.MINIGAME}</span></div>
                        <div class="list-item"><span style="color:#888;">生存积分</span><span>${data.score_breakdown.SURVIVAL}</span></div>
                        <div class="list-item"><span style="font-weight:700;">总积分</span><span style="font-weight:700;color:#667eea;">${data.score_breakdown.total}</span></div>
                    </div>

                    ${data.score_transactions.length > 0 ? `
                    <div style="margin-top: 16px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">积分流水</div>
                        ${data.score_transactions.slice(0, 10).map(tx => `
                            <div class="score-item">
                                <div>
                                    <div style="font-size: 13px;">${tx.reason}</div>
                                    <div style="font-size: 11px; color: #aaa;">${formatDateTime(tx.created_at)}</div>
                                </div>
                                <div class="${tx.score >= 0 ? 'score-positive' : 'score-negative'}">
                                    ${tx.score >= 0 ? '+' : ''}${tx.score}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}

                    <div class="modal-actions">
                        <button class="btn btn-sm" style="background: #f0f0f0; color: #666;" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        loadPlayers();
    </script>
</body>
</html>
