<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人员登录 - 躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">
        <div class="card">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="font-size: 50px; margin-bottom: 8px;">🔧</div>
                <h1 style="font-size: 24px; font-weight: 800; color: #333;">工作人员后台</h1>
                <p style="font-size: 14px; color: #888; margin-top: 4px;">请使用工作人员账号登录</p>
            </div>

            <div id="alert-box"></div>

            <div class="form-group">
                <label>账号</label>
                <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn btn-primary" id="login-btn" onclick="doLogin()">登录</button>

            <p style="text-align: center; margin-top: 16px; font-size: 13px; color: #aaa;">
                <a href="/player/login" style="color: #aaa; text-decoration: none;">玩家入口</a>
            </p>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        // 清除之前的玩家token，避免冲突
        if (getRole() === 'PLAYER') {
            clearToken();
        }
        if (getToken() && getRole() === 'STAFF') {
            window.location.href = '/staff';
        }

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showAlert('请填写账号和密码');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = '登录中...';
            clearAlert();

            try {
                const response = await fetch('/api/auth/staff/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.detail || '登录失败');
                    return;
                }

                // 登录成功
                clearToken();
                setToken(data.access_token, data.role);
                window.location.href = '/staff';
            } catch (err) {
                showAlert('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        function showAlert(msg) {
            document.getElementById('alert-box').innerHTML =
                `<div class="alert alert-danger">${msg}</div>`;
        }

        function clearAlert() {
            document.getElementById('alert-box').innerHTML = '';
        }

        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
