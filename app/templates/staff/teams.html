<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分队管理 - 躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .setting-input {
            width: 80px;
            text-align: center;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>📊 分队管理</h1>
        </div>

        <div id="content">
            <div class="loading">加载中</div>
        </div>

        <div class="card">
            <a href="/staff" class="btn btn-sm" style="background: #f0f0f0; color: #666; display: block; text-align: center; text-decoration: none;">← 返回控制台</a>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        if (!getToken() || getRole() !== 'STAFF') {
            window.location.href = '/staff/login';
        }

        let gameData = null;

        async function loadPage() {
            try {
                const data = await apiGet('/api/staff/games/current/overview');
                if (!data) return;
                gameData = data;
                renderPage(data);
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="card"><p style="color: red;">${err.message}</p></div>`;
            }
        }

        function renderPage(data) {
            const game = data.game;
            const stats = data.statistics;
            const canCreate = game.status === 'ROLE_ASSIGNED';
            const isCreated = ['TEAM_ASSIGNED', 'RUNNING', 'FINISHING', 'FINISHED'].includes(game.status);

            let html = '';

            if (canCreate) {
                html += `
                    <div class="card">
                        <div class="card-title">👥 当前人数</div>
                        <div style="display: flex; justify-content: space-around; text-align: center;">
                            <div>
                                <div style="font-size: 28px; font-weight: 800;">🐱 ${stats.cats}</div>
                                <div style="color: #888;">猫</div>
                            </div>
                            <div>
                                <div style="font-size: 28px; font-weight: 800;">🐭 ${stats.mice}</div>
                                <div style="color: #888;">鼠</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">⚙️ 分队设置</div>
                        <div class="setting-row">
                            <span>猫队数量</span>
                            <input type="number" class="setting-input" id="cat-team-count" value="${game.cat_team_count}" min="1" max="${stats.cats}">
                        </div>
                        <div class="setting-row">
                            <span>鼠队数量</span>
                            <input type="number" class="setting-input" id="mouse-team-count" value="${game.mouse_team_count}" min="1" max="${stats.mice}">
                        </div>
                        <div id="team-preview" style="margin-top: 12px; padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 13px; color: #666;">
                        </div>
                    </div>

                    <div class="card">
                        <button class="btn btn-primary btn-block" onclick="createTeams()">📊 自动分队</button>
                    </div>
                `;
            }

            if (isCreated) {
                html += `
                    <div class="card">
                        <div style="text-align: center; padding: 12px;">
                            <p style="font-size: 16px; font-weight: 600; color: #2ed573;">✅ 分队已完成</p>
                            <p style="font-size: 14px; color: #888; margin-top: 4px;">
                                猫队: ${game.cat_team_count} 个 ｜ 鼠队: ${game.mouse_team_count} 个
                            </p>
                        </div>
                    </div>
                `;
            }

            if (!canCreate && !isCreated) {
                html += `
                    <div class="card">
                        <div style="text-align: center; padding: 20px; color: #888;">
                            <p>请先完成身份分配</p>
                        </div>
                    </div>
                `;
            }

            document.getElementById('content').innerHTML = html;

            if (canCreate) {
                updateTeamPreview();
                document.getElementById('cat-team-count').addEventListener('input', updateTeamPreview);
                document.getElementById('mouse-team-count').addEventListener('input', updateTeamPreview);
            }
        }

        function updateTeamPreview() {
            const stats = gameData?.statistics || {};
            const catTeamCount = parseInt(document.getElementById('cat-team-count')?.value || 1);
            const mouseTeamCount = parseInt(document.getElementById('mouse-team-count')?.value || 1);

            const catsPerTeam = Math.ceil((stats.cats || 0) / catTeamCount);
            const micePerTeam = Math.ceil((stats.mice || 0) / mouseTeamCount);

            const preview = document.getElementById('team-preview');
            if (preview) {
                preview.innerHTML = `
                    <div>🐱 每个猫队约 ${catsPerTeam} 人 (${catTeamCount} 个队)</div>
                    <div>🐭 每个鼠队约 ${micePerTeam} 人 (${mouseTeamCount} 个队)</div>
                `;
            }
        }

        async function createTeams() {
            const catTeamCount = parseInt(document.getElementById('cat-team-count')?.value || 1);
            const mouseTeamCount = parseInt(document.getElementById('mouse-team-count')?.value || 1);

            const confirmed = await showConfirm(
                '确认分队',
                `猫队数量：${catTeamCount}\n鼠队数量：${mouseTeamCount}\n\n确定继续？`
            );
            if (!confirmed) return;

            try {
                const result = await apiPost(`/api/staff/games/current/create-teams?cat_team_count=${catTeamCount}&mouse_team_count=${mouseTeamCount}`);
                showToast(`分队完成！猫队: ${result.cat_teams}，鼠队: ${result.mouse_teams}`, 'success');
                loadPage();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        loadPage();
    </script>
</body>
</html>
