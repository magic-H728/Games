<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - 躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🏆 排行榜</h1>
        </div>

        <div class="nav-bar">
            <a href="/player" class="nav-item">🏠 主页</a>
            <a href="/player/team" class="nav-item">👥 队伍</a>
            <a href="/player/capture" class="nav-item">📷 扫码</a>
            <a href="/player/ranking" class="nav-item active">🏆 排行</a>
        </div>

        <div class="card">
            <div class="tab-group">
                <button class="tab-item active" onclick="switchTab('player')">个人排行</button>
                <button class="tab-item" onclick="switchTab('team')">团队排行</button>
            </div>

            <div class="tab-group">
                <button class="tab-item active" id="filter-all" onclick="filterRole(null)">全部</button>
                <button class="tab-item" id="filter-cat" onclick="filterRole('CAT')">🐱 猫</button>
                <button class="tab-item" id="filter-mouse" onclick="filterRole('MOUSE')">🐭 鼠</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">加载中</div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        if (!getToken() || getRole() !== 'PLAYER') {
            window.location.href = '/player/login';
        }

        let currentTab = 'player';
        let currentRole = null;
        let refreshTimer;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-group:first-of-type .tab-item').forEach((el, i) => {
                el.classList.toggle('active', (i === 0 && tab === 'player') || (i === 1 && tab === 'team'));
            });
            loadRanking();
        }

        function filterRole(role) {
            currentRole = role;
            document.getElementById('filter-all').classList.toggle('active', role === null);
            document.getElementById('filter-cat').classList.toggle('active', role === 'CAT');
            document.getElementById('filter-mouse').classList.toggle('active', role === 'MOUSE');
            loadRanking();
        }

        async function loadRanking() {
            try {
                if (currentTab === 'player') {
                    const url = '/api/rankings/players' + (currentRole ? `?role=${currentRole}` : '');
                    const data = await apiGet(url);
                    if (data) renderPlayerRanking(data);
                } else {
                    const url = '/api/rankings/teams' + (currentRole ? `?role=${currentRole}` : '');
                    const data = await apiGet(url);
                    if (data) renderTeamRanking(data);
                }
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="card"><p style="color: red;">${err.message}</p></div>`;
            }
        }

        function renderPlayerRanking(data) {
            let html = '';

            if (data.my_rank) {
                html += `
                    <div class="card" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">
                        <div style="text-align: center;">
                            <div style="font-size: 14px; opacity: 0.8;">我的排名</div>
                            <div style="font-size: 36px; font-weight: 800;">第 ${data.my_rank} 名</div>
                            <div style="font-size: 18px; margin-top: 4px;">${data.my_score} 分</div>
                        </div>
                    </div>
                `;
            }

            html += '<div class="card">';
            if (data.players.length === 0) {
                html += '<div style="text-align: center; padding: 20px; color: #888;">暂无数据</div>';
            } else {
                data.players.forEach(p => {
                    const rankClass = p.rank <= 3 ? `rank-${p.rank}` : 'rank-other';
                    const medal = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : p.rank;
                    html += `
                        <div class="rank-item" style="cursor: pointer;" onclick="viewPlayerScoreDetail(${p.game_player_id}, '${p.name}')">
                            <div class="rank-number ${rankClass}">${medal}</div>
                            <div class="rank-info">
                                <div class="rank-name">${p.name} ${p.role === 'CAT' ? '🐱' : '🐭'}</div>
                                <div class="rank-team">${p.team_name || '未分队'}</div>
                            </div>
                            <div class="rank-score">${p.total_score}</div>
                        </div>
                    `;
                });
            }
            html += '</div>';

            document.getElementById('content').innerHTML = html;
        }

        function renderTeamRanking(data) {
            let html = '';

            if (data.my_team_rank) {
                html += `
                    <div class="card" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">
                        <div style="text-align: center;">
                            <div style="font-size: 14px; opacity: 0.8;">我的队伍排名</div>
                            <div style="font-size: 36px; font-weight: 800;">第 ${data.my_team_rank} 名</div>
                            <div style="font-size: 18px; margin-top: 4px;">${data.my_team_score} 分</div>
                        </div>
                    </div>
                `;
            }

            html += '<div class="card">';
            if (data.teams.length === 0) {
                html += '<div style="text-align: center; padding: 20px; color: #888;">暂无数据</div>';
            } else {
                data.teams.forEach(t => {
                    const rankClass = t.rank <= 3 ? `rank-${t.rank}` : 'rank-other';
                    const medal = t.rank === 1 ? '🥇' : t.rank === 2 ? '🥈' : t.rank === 3 ? '🥉' : t.rank;
                    html += `
                        <div class="rank-item" style="cursor: pointer;" onclick="viewTeamDetail(${t.team_id}, '${t.team_name}')">
                            <div class="rank-number ${rankClass}">${medal}</div>
                            <div class="rank-info">
                                <div class="rank-name">${t.team_name} ${t.role === 'CAT' ? '🐱' : '🐭'}</div>
                                <div class="rank-team">${t.member_count} 人</div>
                            </div>
                            <div class="rank-score">${t.total_score}</div>
                        </div>
                    `;
                });
            }
            html += '</div>';

            document.getElementById('content').innerHTML = html;
        }

        async function viewTeamDetail(teamId, teamName) {
            try {
                const data = await apiGet(`/api/teams/${teamId}/detail`);
                if (!data) return;

                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.onclick = function(e) { if (e.target === this) this.remove(); };

                let membersHtml = '';
                data.members.forEach(m => {
                    membersHtml += `
                        <div class="list-item">
                            <div>
                                <div style="font-weight: 600;">${m.name} ${m.role === 'CAT' ? '🐱' : '🐭'}</div>
                                <div style="font-size: 12px; color: #888;">${m.student_id}</div>
                            </div>
                            <div style="text-align: right;">
                                ${getStatusBadge(m.status)}
                                <div style="font-size: 13px; color: #667eea; font-weight: 600; margin-top: 2px;">${m.score}分</div>
                            </div>
                        </div>
                    `;
                });

                modal.innerHTML = `
                    <div class="modal" style="max-width: 450px; max-height: 80vh; overflow-y: auto;">
                        <div class="modal-title">🏫 ${teamName}</div>
                        <div style="margin-bottom: 16px;">
                            <div style="font-size: 14px; color: #888;">队伍积分: <span style="font-weight: 700; color: #667eea;">${data.total_score}</span></div>
                        </div>
                        <div>
                            <div style="font-weight: 600; margin-bottom: 8px;">👥 队伍成员</div>
                            ${membersHtml}
                        </div>
                        <div class="modal-actions" style="margin-top: 16px;">
                            <button class="btn btn-sm" style="background: #f0f0f0; color: #666;" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } catch (err) {
                showToast('获取队伍详情失败', 'error');
            }
        }

        async function viewPlayerScoreDetail(gamePlayerId, playerName) {
            try {
                const data = await apiGet(`/api/players/${gamePlayerId}/score-detail`);
                if (!data) return;

                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.onclick = function(e) { if (e.target === this) this.remove(); };

                let transactionsHtml = '';
                if (data.transactions && data.transactions.length > 0) {
                    transactionsHtml = data.transactions.map(tx => `
                        <div class="score-item">
                            <div>
                                <div style="font-size: 13px;">${tx.reason}</div>
                                <div style="font-size: 11px; color: #aaa;">${formatDateTime(tx.created_at)}</div>
                            </div>
                            <div class="${tx.score >= 0 ? 'score-positive' : 'score-negative'}">
                                ${tx.score >= 0 ? '+' : ''}${tx.score}
                            </div>
                        </div>
                    `).join('');
                } else {
                    transactionsHtml = '<div style="text-align: center; color: #888; padding: 10px;">暂无积分记录</div>';
                }

                modal.innerHTML = `
                    <div class="modal" style="max-width: 450px; max-height: 80vh; overflow-y: auto;">
                        <div class="modal-title">${playerName} - 积分明细</div>

                        <div style="margin-bottom: 16px;">
                            <div style="display: flex; justify-content: space-around; text-align: center;">
                                <div>
                                    <div style="font-size: 24px; font-weight: 800; color: #667eea;">${data.capture_score || 0}</div>
                                    <div style="font-size: 12px; color: #888;">抓捕积分</div>
                                </div>
                                <div>
                                    <div style="font-size: 24px; font-weight: 800; color: #ffa502;">${data.minigame_score || 0}</div>
                                    <div style="font-size: 12px; color: #888;">小游戏积分</div>
                                </div>
                                <div>
                                    <div style="font-size: 24px; font-weight: 800; color: #2ed573;">${data.survival_score || 0}</div>
                                    <div style="font-size: 12px; color: #888;">生存积分</div>
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f0f0;">
                                <div style="font-size: 14px; color: #888;">总积分</div>
                                <div style="font-size: 32px; font-weight: 800; color: #667eea;">${data.total_score || 0}</div>
                            </div>
                        </div>

                        <div>
                            <div style="font-weight: 600; margin-bottom: 8px;">📋 积分流水</div>
                            ${transactionsHtml}
                        </div>

                        <div class="modal-actions" style="margin-top: 16px;">
                            <button class="btn btn-sm" style="background: #f0f0f0; color: #666;" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } catch (err) {
                showToast('获取积分详情失败', 'error');
            }
        }

        loadRanking();
        refreshTimer = setInterval(loadRanking, 5000);
    </script>
</body>
</html>
