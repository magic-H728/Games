<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的队伍 - 躲猫猫大挑战</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🐱🐭 躲猫猫大挑战</h1>
        </div>

        <div class="nav-bar">
            <a href="/player" class="nav-item">🏠 主页</a>
            <a href="/player/team" class="nav-item active">👥 队伍</a>
            <a href="/player/capture" class="nav-item">📷 扫码</a>
            <a href="/player/ranking" class="nav-item">🏆 排行</a>
        </div>

        <div id="content">
            <div class="loading">加载中</div>
        </div>
    </div>

    <!-- 成员详情弹窗 -->
    <div id="member-modal" class="modal-overlay" style="display: none;" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-title" id="modal-title">成员信息</div>
            <div id="modal-content"></div>
            <div class="modal-actions">
                <button class="btn btn-sm" style="background: #f0f0f0; color: #666;" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        if (!getToken() || getRole() !== 'PLAYER') {
            window.location.href = '/player/login';
        }

        async function loadTeam() {
            try {
                const data = await apiGet('/api/players/me/team');
                if (!data) return;
                renderTeam(data);
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="card"><p style="color: red;">${err.message}</p></div>`;
            }
        }

        function renderTeam(data) {
            if (!data.team) {
                document.getElementById('content').innerHTML = `
                    <div class="card">
                        <div style="text-align: center; padding: 40px 0; color: #888;">
                            <div style="font-size: 50px; margin-bottom: 12px;">👥</div>
                            <p>队伍尚未分配</p>
                            <p style="font-size: 13px; margin-top: 4px;">请等待工作人员完成分队</p>
                        </div>
                    </div>
                `;
                return;
            }

            const team = data.team;
            const members = data.members || [];
            const isTeamCat = team.role === 'CAT';

            let membersHtml = members.map(m => `
                <div class="list-item" onclick="showMemberDetail(${JSON.stringify(m).replace(/"/g, '&quot;')})" style="cursor: pointer;">
                    <div>
                        <div style="font-weight: 600;">${m.name} ${m.role === 'CAT' ? '🐱' : '🐭'}</div>
                        <div style="font-size: 12px; color: #888;">${m.student_id}</div>
                    </div>
                    <div style="text-align: right;">
                        ${getStatusBadge(m.status)}
                        <div style="font-size: 13px; color: #667eea; font-weight: 600; margin-top: 2px;">${m.total_score}分</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('content').innerHTML = `
                <div class="card" style="background: ${isTeamCat ? 'linear-gradient(135deg, #ffeaa7, #fdcb6e)' : 'linear-gradient(135deg, #74b9ff, #0984e3)'}; color: ${isTeamCat ? '#333' : 'white'};">
                    <div style="text-align: center;">
                        <div style="font-size: 40px; margin-bottom: 8px;">${isTeamCat ? '🐱' : '🐭'}</div>
                        <div style="font-size: 22px; font-weight: 800;">${team.name}</div>
                        <div style="font-size: 14px; opacity: 0.8; margin-top: 4px;">队伍积分: ${team.total_score}</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">👥 队伍成员 (${members.length}人)</div>
                    <p style="font-size: 12px; color: #888; margin-bottom: 8px;">点击成员查看详情</p>
                    ${membersHtml}
                </div>
            `;
        }

        function showMemberDetail(member) {
            document.getElementById('modal-title').textContent = member.name;

            let content = `
                <div style="text-align: center; margin-bottom: 16px;">
                    <div style="font-size: 50px; margin-bottom: 8px;">${member.role === 'CAT' ? '🐱' : '🐭'}</div>
                    <div style="font-size: 18px; font-weight: 700;">${member.name}</div>
                    <div style="margin-top: 4px;">${getRoleBadge(member.role)}</div>
                </div>

                <div class="list-item">
                    <span style="color: #888;">学号</span>
                    <span style="font-weight: 600;">${member.student_id}</span>
                </div>
                <div class="list-item">
                    <span style="color: #888;">微信号</span>
                    <span style="font-weight: 600;">${member.wechat_id || '未填写'}</span>
                </div>
                <div class="list-item">
                    <span style="color: #888;">状态</span>
                    <span>${getStatusBadge(member.status)}</span>
                </div>
                <div class="list-item">
                    <span style="color: #888;">积分</span>
                    <span style="font-weight: 700; color: #667eea;">${member.total_score}</span>
                </div>
            `;

            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('member-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('member-modal').style.display = 'none';
        }

        loadTeam();
    </script>
</body>
</html>
